<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Meal Engine | პრემიუმ მენიუ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- PWA Manifest Link -> მოგვიანებით დავამატებთ -->
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-bg"></div>

    <header class="top-header">
        <div class="logo">
            <h1>Smart Meal <span>Engine</span></h1>
        </div>
        <div class="header-actions">
            <button id="history-btn" class="btn-icon" aria-label="ბოლო დატრიალებები"><i class="fa-solid fa-clock-rotate-left"></i></button>
            <button id="favorites-btn" class="btn-icon" aria-label="ჩემი რჩეულები"><i class="fa-solid fa-heart"></i></button>
            <button id="admin-btn" class="btn-outline" aria-label="ბაზის მართვა"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <main class="container">
        
        <section class="presets-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> ჭკვიანი კონსტრუქტორი</h2>
                <p>აირჩიე მზა შაბლონი ან ააწყვე შენი უნიკალური კომბო</p>
            </div>
            
            <div class="preset-buttons">
                <button class="preset-btn" data-preset="quick"><i class="fa-solid fa-bolt"></i> სწრაფი ვახშამი</button>
                <button class="preset-btn" data-preset="date"><i class="fa-solid fa-wine-glass"></i> პაემანი</button>
                <button class="preset-btn" data-preset="feast"><i class="fa-solid fa-users"></i> სტუმრები</button>
                <button class="preset-btn active" data-preset="custom"><i class="fa-solid fa-sliders"></i> შენით აწყობა</button>
            </div>

            <!-- სმარტ ფილტრები -->
            <div class="smart-filters-panel">
                <label class="filter-switch" aria-label="დროის ფილტრი">
                    <input type="checkbox" id="filter-time">
                    <div class="filter-box">
                        <i class="fa-solid fa-stopwatch"></i> მხოლოდ სწრაფი (30წთ)
                    </div>
                </label>
                <label class="filter-switch" aria-label="სირთულის ფილტრი">
                    <input type="checkbox" id="filter-easy">
                    <div class="filter-box">
                        <i class="fa-solid fa-cube"></i> მხოლოდ მარტივი (ან მზა)
                    </div>
                </label>
            </div>

            <div id="custom-combo-builder" class="custom-builder-panel">
                <div class="counter-grid" id="custom-counters-container"></div>
            </div>

            <div class="combo-action">
                <button id="spin-combo-btn" class="btn-primary btn-glow btn-large">
                    <i class="fa-solid fa-dice"></i> მენიუს გენერაცია
                </button>
            </div>
        </section>

        <section class="inventory-section">
            <div class="section-header inventory-header">
                <div class="inventory-title-group">
                    <h2><i class="fa-solid fa-kitchen-set"></i> რა გვაქვს სახლში?</h2>
                    <div class="inventory-actions">
                        <button id="clear-inventory-btn" class="btn-outline btn-small"><i class="fa-solid fa-trash-can"></i> გასუფთავება</button>
                        <button id="find-meals-btn" class="btn-primary btn-small"><i class="fa-solid fa-magnifying-glass"></i> რა მოვამზადო?</button>
                    </div>
                </div>
                
                <div class="toggle-container">
                    <span class="toggle-label">მაღაზიაში ჩასვლა არ მეზარება</span>
                    <label class="switch">
                        <input type="checkbox" id="store-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            
            <div class="ingredient-chips" id="ingredient-list"></div>
        </section>

        <section class="results-section">
            <!-- ანტი-სინერგიის Alert ბლოკი გამოჩნდება აქ JS-ით -->
            <div id="dissonance-alert-container"></div>
            <div class="categories-grid" id="categories-container"></div>
            
            <!-- მენიუს გაზიარების ღილაკი -->
            <div class="share-action-container hidden" id="share-menu-container">
                <button id="share-menu-btn" class="btn-outline"><i class="fa-regular fa-copy"></i> მენიუს დაკოპირება</button>
            </div>
        </section>

    </main>

    <!-- Admin მოდალი -->
    <dialog id="admin-modal" class="modal">
        <div class="modal-content admin-scroll">
            <header class="modal-header"><h2>ბაზის მართვა</h2></header>
            <form id="admin-form">
                <!-- ველები (იგივე რაც იყო) -->
                <div class="form-group"><label>სახელი</label><input type="text" id="dish-name" required></div>
                <div class="form-row">
                    <div class="form-group"><label>კატეგორია</label><select id="dish-category" required></select></div>
                    <div class="form-group"><label>სირთულე</label><select id="dish-difficulty" required><option value="easy">მარტივი</option><option value="medium" selected>საშუალო</option><option value="hard">რთული</option></select></div>
                </div>
                <div class="form-group security-group"><label>PIN</label><input type="password" id="admin-pin" required></div>
                <footer class="form-actions"><button type="submit" class="btn-primary">შენახვა</button></footer>
            </form>
        </div>
    </dialog>

    <!-- კერძის დეტალების მოდალი -->
    <dialog id="meal-detail-modal" class="modal detail-modal-wrapper">
        <div class="modal-content meal-detail-content">
            <button class="close-detail-modal"><i class="fa-solid fa-xmark"></i></button>
            <div id="meal-detail-body"></div>
        </div>
    </dialog>

    <!-- Smart Recipes / History / Favorites Modal (მრავალფუნქციური) -->
    <dialog id="list-modal" class="modal">
        <div class="modal-content admin-scroll">
            <header class="modal-header">
                <h2 id="list-modal-title"></h2>
            </header>
            <div id="list-modal-body"></div>
        </div>
    </dialog>

    <!-- TEMPLATES -->
    <template id="meal-card-template">
        <article class="category-card">
            <div class="card-bg-overlay"></div>
            <div class="skeleton-loader"></div>
            <div class="card-content-wrapper">
                <header class="card-header">
                    <h3 class="category-title"></h3>
                    <div class="card-top-actions">
                        <button class="fav-card-btn"><i class="fa-regular fa-heart"></i></button>
                        <button class="remove-card-btn"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </header>
                <div class="card-body">
                    <div class="slot-machine-window"><div class="slot-reel"><div class="result-placeholder"></div></div></div>
                    <div class="meal-meta-container">
                        <div class="meal-meta"></div>
                        <div class="card-tags"></div>
                        <!-- პროცენტული ბარი -->
                        <div class="ingredient-progress-bar-wrapper">
                            <div class="progress-bar-fill"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn-spin-single"><i class="fa-solid fa-rotate-right"></i></button>
        </article>
    </template>

    <template id="counter-template">
        <div class="counter-item">
            <span class="counter-label"></span>
            <div class="counter-controls">
                <button type="button" class="counter-btn minus"><i class="fa-solid fa-minus"></i></button>
                <input type="number" class="counter-input" value="0" min="0" max="5" readonly>
                <button type="button" class="counter-btn plus"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
    </template>

    <script type="module" src="app.js"></script>
</body>
</html>
