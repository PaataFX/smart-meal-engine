<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Meal Engine | პრემიუმ მენიუ</title>
    
    <!-- Google Fonts - პრემიუმ ვიზუალისთვის (მაგ. Playfair Display სათაურებისთვის და Montserrat ტექსტისთვის) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome აიკონებისთვის -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS ფაილის მიბმა -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- მთავარი ნავიგაცია -->
    <header class="top-header">
        <div class="logo">
            <h1>Smart Meal <span>Engine</span></h1>
        </div>
        <button id="admin-btn" class="btn-outline">
            <i class="fa-solid fa-gear"></i> ბაზის მართვა
        </button>
    </header>

    <main class="container">
        
        <!-- სექცია 1: პრესეტები და ვახშმის კონსტრუქტორი -->
        <section class="presets-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> ჭკვიანი კონსტრუქტორი</h2>
                <p>აირჩიე მზა შაბლონი ან ააწყვე შენი კომბო</p>
            </div>
            
            <div class="preset-buttons">
                <button class="preset-btn" data-preset="quick"><i class="fa-solid fa-bolt"></i> სწრაფი ვახშამი</button>
                <button class="preset-btn" data-preset="date"><i class="fa-solid fa-wine-glass"></i> პაემანი</button>
                <button class="preset-btn" data-preset="feast"><i class="fa-solid fa-users"></i> 10-კაციანი სუფრა</button>
                <button class="preset-btn active" data-preset="custom"><i class="fa-solid fa-sliders"></i> შენით აწყობა</button>
            </div>

            <div class="combo-action">
                <button id="spin-combo-btn" class="btn-primary">
                    <i class="fa-solid fa-dice"></i> სრული მენიუს გენერაცია
                </button>
            </div>
        </section>

        <!-- სექცია 2: მაცივრის ინვენტარი (Pantry) -->
        <section class="inventory-section">
            <div class="section-header inventory-header">
                <h2><i class="fa-solid fa-kitchen-set"></i> რა გვაქვს სახლში?</h2>
                <div class="toggle-container">
                    <span class="toggle-label">მაღაზიაში ჩასვლა არ მეზარება</span>
                    <label class="switch">
                        <input type="checkbox" id="store-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            
            <div class="ingredient-chips" id="ingredient-list">
                <!-- JS-ით ჩაიტვირთება ინგრედიენტების ჩიპები -->
                <!-- მაგ: <span class="chip active">კარტოფილი</span> -->
            </div>
        </section>

        <!-- სექცია 3: კატეგორიების რენდომაიზერები (9 ბლოკი) -->
        <section class="categories-grid" id="categories-container">
            <!-- კატეგორიების ბარათები JS-ით დაგენერირდება აქ -->
            <!-- ნიმუში, თუ როგორ გამოიყურება ერთი ბარათი (HTML-ში წარმოდგენისთვის):
            <div class="category-card" data-category="main">
                <div class="card-header">
                    <h3>🍲 ძირითადი კერძები</h3>
                </div>
                <div class="card-body">
                    <div class="result-placeholder">დაატრიალე კატეგორია...</div>
                </div>
                <button class="btn-spin-single"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            -->
        </section>

    </main>

    <!-- Admin მოდალური ფანჯარა (ახალი კერძის დამატება/რედაქტირება) -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>კერძის მართვა</h2>
                <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="admin-form">
                <div class="form-group">
                    <label for="dish-name">კერძის სახელი</label>
                    <input type="text" id="dish-name" required placeholder="მაგ. ხინკალი">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="dish-category">კატეგორია</label>
                        <select id="dish-category" required>
                            <option value="main">ძირითადი კერძი</option>
                            <option value="soup">წვნიანი</option>
                            <option value="salad">სალათი</option>
                            <option value="cold">ფხალეული და ცივი</option>
                            <option value="bakery">ცომეული და გამომცხვარი</option>
                            <option value="garnish">გარნირი და ფაფა</option>
                            <option value="sauce">საწებელი და სოუსი</option>
                            <option value="dessert">დესერტი</option>
                            <option value="extra">დანამატი/მწნილი</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dish-difficulty">სირთულე</label>
                        <select id="dish-difficulty">
                            <option value="easy">მარტივი</option>
                            <option value="medium">საშუალო</option>
                            <option value="hard">რთული</option>
                        </select>
                    </div>
                </div>

                <!-- აქ დაემატება დროის, ფასის და თეგების ველები JS-ის მეშვეობით -->
                
                <div class="form-group security-group">
                    <label for="admin-pin"><i class="fa-solid fa-lock"></i> PIN კოდი (ცვლილებისთვის)</label>
                    <input type="password" id="admin-pin" required placeholder="შეიყვანეთ კოდი">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-outline cancel-btn">გაუქმება</button>
                    <button type="submit" class="btn-primary save-btn">შენახვა</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS ფაილის მიბმა -->
    <script type="module" src="app.js"></script>
</body>
</html>
